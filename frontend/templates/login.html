<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGS - Acceso al Sistema</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ucc: {
                            navy: '#071833',
                            azul: '#0e4a8a',
                            medio: '#1a66b8',
                            dorado: '#edb309',
                            oro: '#e8c547',
                            plata: '#f4f7fb',
                            texto: '#12213a',
                            muted: '#5c6b80'
                        }
                    }
                }
            }
        }
    </script>
    <style>.hidden { display: none !important; }</style>
</head>
<body class="h-screen flex items-center justify-center font-sans" style="background: linear-gradient(160deg, #071833 0%, #0c274f 55%, #0e4a8a 100%);">
    <div class="absolute top-0 left-0 right-0 h-1.5 bg-ucc-dorado"></div>
    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl w-[400px] border-t-4 border-ucc-dorado">
        <div class="text-center mb-8">
            <div class="bg-ucc-azul w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white font-bold shadow-lg ring-2 ring-ucc-dorado">SGS</div>
            <h1 id="title" class="text-3xl font-black text-ucc-texto tracking-tighter">Bienvenido</h1>
            <p id="subtitle" class="text-ucc-muted text-sm">Universidad Católica de Colombia</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <input type="email" id="l-email" placeholder="Correo electrónico" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <input type="password" id="l-pass" placeholder="Contraseña" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-ucc-dorado transition">
            <button type="submit" class="w-full bg-ucc-azul text-white font-bold py-4 rounded-2xl hover:bg-ucc-navy shadow-xl transition transform active:scale-95">Entrar al Sistema</button>
            <p class="text-center text-xs text-ucc-muted">¿No tienes cuenta? <a href="javascript:toggle()" class="text-ucc-azul font-bold underline">Regístrate ahora</a></p>
        </form>

        <form id="registerForm" class="hidden space-y-4">
            <input type="text" id="r-nombre" placeholder="Nombre completo" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl">
            <input type="email" id="r-email" placeholder="Correo electrónico" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl">
            <input type="password" id="r-pass" placeholder="Crear contraseña" required class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl">
            <select id="r-rol" class="w-full p-4 bg-ucc-plata border border-slate-100 rounded-2xl outline-none bg-white">
                <option value="2">Administrador</option>
                <option value="3">Docente</option>
            </select>
            <button type="submit" class="w-full bg-ucc-dorado text-ucc-navy font-bold py-4 rounded-2xl hover:bg-ucc-oro shadow-xl transition transform active:scale-95">Crear Cuenta Nueva</button>
            <p class="text-center text-xs text-ucc-muted">¿Ya tienes cuenta? <a href="javascript:toggle()" class="text-ucc-azul font-bold underline">Inicia sesión</a></p>
        </form>
    </div>

    <script>
        const API = window.location.origin + "/api";

        function toggle() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
            const isReg = !document.getElementById('registerForm').classList.contains('hidden');
            document.getElementById('title').innerText = isReg ? "Nueva Cuenta" : "Bienvenido";
            document.getElementById('subtitle').innerText = isReg ? "Crea tu perfil con un rol" : "Universidad Católica de Colombia";
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        email: document.getElementById('l-email').value,
                        password: document.getElementById('l-pass').value
                    })
                });
                const result = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = 'index.html';
                } else {
                    alert("Error: " + (result.message || result.detail || "no se pudo iniciar sesion"));
                }
            } catch (err) {
                alert("Fallo de red: El servidor Python está apagado.");
            }
        };

        document.getElementById('registerForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('r-nombre').value,
                email: document.getElementById('r-email').value,
                password: document.getElementById('r-pass').value,
                id_rol: parseInt(document.getElementById('r-rol').value, 10)
            };
            try {
                const res = await fetch(`${API}/usuarios`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                alert(result.message);
                if (res.ok) toggle();
            } catch (err) {
                alert("Error al conectar para el registro.");
            }
        };
    </script>
</body>
</html>
