name: CI/CD Pipeline - SGS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Flask)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de codigo
        uses: actions/checkout@v3

      - name: Configurar entorno Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalacion de dependencias
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Analisis estático de código
        run: |
          flake8 backend/ --max-line-length=120

      - name: Ejecución de pruebas unitarias
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          cd backend
          pytest

  frontend-ci:
    name: Frontend CI (React / TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Instalación de paquetes
        run: |
          cd frontend
          npm ci

      - name: Validación de linter y tipos
        run: |
          cd frontend
          npm run lint

      - name: Compilacion del proyecto
        run: |
          cd frontend
          npm run build

  deploy-blue-green:
    name: Despliegue en Produccion (Blue-Green)
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de código
        uses: actions/checkout@v3

      - name: Despliegue en ambiente inactivo (Green)
        run: |
          curl -X POST ${{ secrets.DEPLOY_HOOK_GREEN }}

      - name: Aplicacion de migraciones PostgreSQL
        env:
          DB_HOST: ${{ secrets.POSTGRES_HOST }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DB_NAME: ${{ secrets.POSTGRES_DB }}
        run: |
          python backend/database/run_migrations.py

      - name: Comprobacion de estado (Health Check)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://green.sgsdev.com/api/health)
          if [ $STATUS -ne 200 ]; then
            echo "Fallo en verificacion de salud. Despliegue cancelado."
            exit 1
          fi

      - name: Enrutamiento de tráfico a nuevo ambiente
        run: |
          curl -X POST ${{ secrets.SWITCH_TRAFFIC_HOOK }}
