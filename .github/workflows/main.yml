name: Pipeline CI/CD - Sistema Gestor de Salones (SGS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
 
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Instalación de dependencias
        run: npm ci

      - name: Linter y Type Check
        run: npm run lint

      - name: Compilación del Frontend (Build)
        run: npm run build

  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalación de dependencias
        run: pip install -r requirements.txt


      - name: Ejecutar Pruebas Unitarias e Integración (PyTest)
        run: pytest

  deploy-cd:
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales y desplegar en Servidor GREEN
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}[cite: 1]
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}[cite: 1]
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}[cite: 1]
          JWT_SECRET: ${{ secrets.JWT_SECRET }}[cite: 1]
        run: |
          echo "Iniciando despliegue en entorno GREEN..."
          # Comandos SSH o CLI para desplegar en el servidor/contenedor secundario

      - name: Ejecutar Migraciones en PostgreSQL
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}[cite: 1]
        run: |
          echo "Ejecutando scripts de actualización sobre la base de datos central..."

      - name: Health Check HTTP
        id: health_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://green.tusistema.com/health)
          if [ "$STATUS" -ne 200 ]; then
            echo "El Health Check fallo con codigo $STATUS"
            exit 1
          fi

      - name: Conmutar Trafico (Switch a GREEN)
        if: success()
        run: |
          echo "Health Check exitoso. Cambiando Nginx/DNS hacia GREEN..."

      - name: Rollback en caso de fallo
        if: failure()
        run: |
          echo "Fallo detectado en la verificación. Reteniendo tráfico en BLUE..."
